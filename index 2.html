<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage It</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1B2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manage It">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1B2E; --surface:#232544; --surface-2:#2C2F55;
    --lime:#C4F135; --coral:#FF6F61; --sky:#5AC8FA; --gold:#F5D76E; --violet:#B08BFF;
    --text:#F5F5F7; --muted:#9092B5; --line:#34365C; --row-h:13px;
  }
  html[data-theme="light"]{
    --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#EEF0F8;
    --text:#1A1B2E; --muted:#6B6E8C; --line:#DDE0EE;
  }
  html[data-theme="light"] .task-block, html[data-theme="light"] .chip.selected,
  html[data-theme="light"] .day-tab.active, html[data-theme="light"] button.submit,
  html[data-theme="light"] .check.done{ color:#1A1B2E; }
  body{ transition: background .25s ease, color .25s ease; }

  #loadingOverlay{ position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; transition: opacity .3s ease; }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--surface-2); border-top-color:var(--lime);
    animation: spin .8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #loadingOverlay .load-label{ font-family:'Suez One',serif; color:var(--muted); font-size:14px; }

  @keyframes fadeInUp{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }
  .task-item, .task-block{ animation: fadeInUp .28s ease; }
  @keyframes pulseLine{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  .now-line{ animation: pulseLine 2s ease-in-out infinite; }

  .theme-toggle{ background: var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:999px;
    width:38px; height:38px; font-size:16px; cursor:pointer; flex-shrink:0; }
  .theme-toggle:active{ transform: scale(0.9); }

  .streak-badge{ display:inline-flex; align-items:center; gap:6px; background: var(--surface-2);
    border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; margin: 4px 20px 4px; }
  .streak-badge strong{ color: var(--gold); font-family:'Suez One',serif; }

  .stat-row{ margin-bottom:10px; }
  .stat-row-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .stat-row-top .cnt{ color: var(--muted); }
  .stat-bar-bg{ height:8px; border-radius:999px; background: var(--surface-2); overflow:hidden; }
  .stat-bar-fill{ height:100%; border-radius:999px; transition: width .5s ease; }

  .onboard-dots{ display:flex; gap:6px; justify-content:center; margin-top:16px; }
  .onboard-dot{ width:7px; height:7px; border-radius:50%; background: var(--line); }
  .onboard-dot.active{ background: var(--lime); width:18px; border-radius:4px; transition: all .2s ease; }
  .onboard-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .onboard-emoji{ font-size:40px; margin-bottom:10px; text-align:center; }

  .empty{ color: var(--muted); font-size:13px; text-align:center; padding:28px 0; }
  .empty .empty-emoji{ font-size:34px; display:block; margin-bottom:8px; }

  .summary-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .summary-row:last-child{ border-bottom:none; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: var(--bg); color: var(--text); font-family:'Heebo',sans-serif; min-height:100vh; padding-bottom:40px; }
  header{ padding: 26px 20px 16px; position: relative; overflow:hidden; display:flex; justify-content:space-between; align-items:flex-start; }
  header::after{ content:""; position:absolute; inset-inline-start:-40px; top:-60px; width:180px; height:180px; border-radius:50%;
    background: radial-gradient(circle, rgba(196,241,53,0.18), transparent 70%); }
  h1{ font-family:'Suez One',serif; font-size:32px; letter-spacing:.5px; }
  header p{ color: var(--muted); margin-top:4px; font-size:13.5px; max-width: 240px; }
  .lang-toggle{ background: var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:999px;
    padding:8px 14px; font-size:13px; cursor:pointer; font-family:'Heebo'; font-weight:700; z-index:2; flex-shrink:0; }
  .lang-toggle:active{ transform: scale(0.95); }
  select.lang-toggle{ appearance:none; -webkit-appearance:none; padding-inline-end:26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }

  .toolbar-row{ display:flex; gap:10px; margin: 0 20px 6px; }
  .toolbar-row button{ flex:1; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,10,20,.7); z-index:50;
    display:none; align-items:center; justify-content:center; padding:24px; }
  .modal-card{ background: var(--surface); border-radius:20px; padding:22px; max-width:360px; width:100%;
    position:relative; }
  .modal-card h2{ font-family:'Suez One',serif; font-size:22px; margin-bottom:12px; font-weight:normal; color:var(--lime); }
  .modal-card p{ font-size:14px; line-height:1.7; color: var(--text); margin-bottom:10px; }
  .modal-close{ position:absolute; top:14px; inset-inline-end:14px; background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer; }

  .card{ margin: 14px 20px; background: var(--surface); border-radius: 18px; padding: 16px; }
  .card h2{ font-size: 14px; color: var(--muted); font-weight:500; margin-bottom: 12px; }

  .settings-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .settings-row .field{ flex:1; min-width: 110px; }
  .field label{ display:block; font-size:11.5px; color: var(--muted); margin-bottom:4px; }
  input[type=text], input[type=time], input[type=number]{
    width:100%; background: var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; color: var(--text); font-family:'Heebo'; font-size:14.5px;
  }
  input:focus{ outline: 2px solid var(--lime); }

  .field{ margin-bottom: 10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:7px 12px; border-radius:999px; background: var(--surface-2); border:1px solid var(--line);
    color: var(--muted); font-size:13px; cursor:pointer; user-select:none; }
  .chip.selected{ background: var(--lime); color:#1A1B2E; border-color:var(--lime); font-weight:700; }
  .cat-chip{ display:flex; align-items:center; gap:6px; }
  .cat-dot{ width:9px; height:9px; border-radius:50%; }
  .toggle-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .toggle-row input{ width:auto; }
  .toggle-row label{ font-size:13px; color: var(--text); }

  button.submit{ margin-top:4px; width:100%; padding:13px; border:none; border-radius:12px;
    background: var(--lime); color:#1A1B2E; font-weight:700; font-size:15px; cursor:pointer; font-family:'Heebo'; }
  button.submit:active{ transform: scale(0.98); }
  button.secondary{ background: var(--surface-2); color: var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 14px; font-size:13px; cursor:pointer; font-family:'Heebo'; }

  .suggest-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .suggest-chip{ background: var(--surface-2); border:1px dashed var(--line); border-radius:14px;
    padding:9px 12px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .suggest-chip:active{ transform: scale(0.97); }
  .suggest-chip .plus{ color: var(--lime); font-weight:700; }

  .round-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .round-btn:active{ transform: scale(0.92); }

  .day-tabs{ display:flex; gap:8px; margin: 16px 20px 0; overflow-x:auto; padding-bottom:4px; }
  .day-tab{ flex-shrink:0; padding:8px 16px; border-radius:999px; background: var(--surface-2);
    color: var(--muted); font-size:13px; cursor:pointer; white-space:nowrap; }
  .day-tab.active{ background: var(--lime); color:#1A1B2E; font-weight:700; }

  .rail-section{ margin: 16px 20px; }
  .rail-section h2{ font-size:14px; color: var(--muted); font-weight:500; margin-bottom:10px; }
  .rail-outer{ background: var(--surface); border-radius:18px; padding:14px 4px 14px 10px; position:relative; }
  .rail-grid{ display:grid; grid-template-columns: 1fr 46px; position:relative; }
  .hour-label{ grid-column:2; font-size:10.5px; color: var(--muted); text-align:center; padding-top:2px; border-top:1px solid var(--line); }
  .task-block{ grid-column:1; border-radius:8px; padding:3px 9px; font-size:11.5px; display:flex; align-items:center;
    overflow:hidden; margin-inline-end:2px; color:#1A1B2E; font-weight:600; }
  .task-block.done{ opacity:.35; text-decoration: line-through; }
  .task-block.overflow{ outline: 2px dashed var(--coral); }
  .now-line{ position:absolute; inset-inline-start:0; inset-inline-end:46px; height:2px; background: var(--coral); z-index:5; }
  .now-line::after{ position:absolute; inset-inline-end:0; top:-16px; font-size:10px; color: var(--coral);
    background: var(--surface); padding:0 4px; border-radius:4px; content: attr(data-label); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .legend-item{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  .legend-dot{ width:8px; height:8px; border-radius:50%; }

  .list-section{ margin: 20px 20px; }
  .list-section h2{ font-size:14px; color: var(--muted); font-weight:500; margin-bottom:10px; }
  .task-item{ display:flex; align-items:center; gap:10px; background: var(--surface); border-radius:14px;
    padding:12px 14px; margin-bottom:8px; }
  .task-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .task-item .info{ flex:1; min-width:0; }
  .task-item .title{ font-size:14px; font-weight:500; }
  .task-item .title.done{ text-decoration: line-through; color: var(--muted); }
  .task-item .meta{ font-size:11px; color: var(--muted); margin-top:2px; }
  .task-item .meta.overflow{ color: var(--coral); }
  .task-item button{ background:none; border:none; color: var(--muted); font-size:16px; cursor:pointer; padding:4px 8px; }
  .task-item .check{ width:22px; height:22px; border-radius:6px; border:2px solid var(--line); flex-shrink:0;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .task-item .check.done{ background: var(--lime); border-color: var(--lime); color:#1A1B2E; }
  .empty{ color: var(--muted); font-size:13px; text-align:center; padding:20px 0; }
  .reset-link{ display:block; text-align:center; color: var(--muted); font-size:12px; margin:18px 20px 0;
    text-decoration: underline; cursor:pointer; background:none; border:none; }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="load-label">Manage It</div>
</div>

<header>
  <div>
    <h1>Manage It</h1>
    <p data-i18n="tagline"></p>
  </div>
  <div style="display:flex; gap:8px; align-items:flex-start;">
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <select class="lang-toggle" id="langSelect">
      <option value="en">English</option>
      <option value="he">עברית</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="pt">Português</option>
      <option value="ru">Русский</option>
      <option value="ar">العربية</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="hi">हिन्दी</option>
    </select>
  </div>
</header>

<div id="streakBadge" class="streak-badge" style="display:none;"></div>

<div class="toolbar-row">
  <button class="secondary" id="shareBtn"></button>
  <button class="secondary" id="aboutBtn"></button>
</div>
<div class="toolbar-row">
  <button class="secondary" id="summaryBtn"></button>
  <button class="secondary" id="notifyBtn"></button>
</div>

<div class="modal-overlay" id="summaryOverlay">
  <div class="modal-card">
    <button class="modal-close" id="summaryClose">✕</button>
    <h2 data-i18n="summaryTitle"></h2>
    <div id="summaryContent"></div>
  </div>
</div>

<div class="modal-overlay" id="onboardOverlay">
  <div class="modal-card">
    <div class="onboard-emoji" id="onboardEmoji"></div>
    <h2 id="onboardTitle"></h2>
    <p id="onboardBody"></p>
    <div class="onboard-dots" id="onboardDots"></div>
    <div class="onboard-nav">
      <button class="secondary" id="onboardSkip"></button>
      <button class="submit" id="onboardNext" style="width:auto; padding:10px 20px;"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="aboutOverlay">
  <div class="modal-card">
    <button class="modal-close" id="aboutClose">✕</button>
    <h2 data-i18n="aboutTitle"></h2>
    <p data-i18n="aboutBody1"></p>
    <p data-i18n="aboutBody2"></p>
  </div>
</div>

<div class="card">
  <h2 data-i18n="settingsTitle"></h2>
  <div class="settings-row">
    <div class="field">
      <label data-i18n="dayStart" for="dayStartInput"></label>
      <input type="time" id="dayStartInput" value="07:00">
    </div>
    <div class="field">
      <label data-i18n="dayEnd" for="dayEndInput"></label>
      <input type="time" id="dayEndInput" value="23:00">
    </div>
    <div class="field">
      <label data-i18n="numDays" for="numDaysInput"></label>
      <input type="number" id="numDaysInput" value="1" min="1" max="7">
    </div>
  </div>
  <div class="field">
    <label data-i18n="bedtime" for="bedtimeInput"></label>
    <input type="time" id="bedtimeInput" value="22:30">
  </div>
</div>

<div class="card" id="statsCard">
  <h2 data-i18n="statsTitle"></h2>
  <div id="statsContent"></div>
</div>

<div class="card">
  <h2 data-i18n="taskCardTitle"></h2>
  <div class="field">
    <label data-i18n="taskLabel" for="titleInput"></label>
    <input type="text" id="titleInput" maxlength="40">
  </div>
  <div class="field">
    <label data-i18n="categoryLabel"></label>
    <div class="chips" id="catChips"></div>
  </div>
  <div class="field">
    <label data-i18n="dayLabel"></label>
    <div class="chips" id="dayChips"></div>
  </div>
  <div class="field">
    <label data-i18n="durationLabel"></label>
    <div style="display:flex; gap:8px; align-items:center;">
      <input type="number" id="durationHoursInput" min="0" max="23" step="1" value="0" style="width:70px;">
      <span id="durHoursLabelText" style="font-size:12.5px;color:var(--muted);"></span>
      <input type="number" id="durationMinInput" min="0" max="59" step="1" value="30" style="width:70px;">
      <span id="durMinLabelText" style="font-size:12.5px;color:var(--muted);"></span>
    </div>
    <div class="chips" id="durationChips" style="margin-top:8px;"></div>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="fixedTimeToggle">
    <label data-i18n="fixedToggle" for="fixedTimeToggle"></label>
  </div>
  <div class="field" id="fixedTimeField" style="display:none">
    <label data-i18n="fixedTimeLabel" for="fixedTimeInput"></label>
    <input type="time" id="fixedTimeInput">
  </div>
  <button class="submit" id="addBtn" data-i18n="addBtn"></button>
</div>

<div class="card">
  <h2 data-i18n="suggestTitle"></h2>
  <div class="suggest-chips" id="suggestChips"></div>
  <button class="secondary" id="refreshSuggestBtn" data-i18n="refreshSuggest"></button>
</div>

<div class="card">
  <h2 data-i18n="templatesTitle"></h2>
  <div class="chips" id="templateChips"></div>
  <div id="templateEmpty" class="empty" style="display:none; padding:6px 0;"></div>
  <button class="secondary" id="saveTemplateBtn" style="width:100%; margin-top:8px;"></button>
</div>

<div class="day-tabs" id="dayTabs"></div>

<div class="rail-section">
  <h2 id="railTitle"></h2>
  <div class="rail-outer"><div class="rail-grid" id="railGrid"></div></div>
  <div class="legend" id="legend"></div>
</div>

<div class="list-section">
  <h2 data-i18n="tasksTitle"></h2>
  <div id="taskList"></div>
</div>

<button class="reset-link" id="resetBtn" data-i18n="resetLink"></button>

<script>
const STORAGE_KEY = 'manageit-v1';
let tasks = [];
let templates = [];
let completions = {}; // { taskId: { date: 'YYYY-M-D', category } }
let settings = { dayStart: 7*60, dayEnd: 23*60, numDays: 1, bedtime: 22*60+30, lang: 'en', theme: 'dark' };
let selectedDuration = 30;
let selectedCategory = 'study';
let selectedDay = 0;
let activeTab = 0;
let seqCounter = 0;

const DURATIONS = [15,30,45,60,90,120];
const CAT_IDS = ['study','hobby','food','sleep','other'];
const CAT_COLORS = {study:'#5AC8FA', hobby:'#C4F135', food:'#F5D76E', sleep:'#B08BFF', other:'#FF6F61'};
const SUGGESTION_IDS = ['walk','noscreen','water','stretch','tidy','friend','read','planTomorrow','mealNoScreen','outside','breathe','sleepgo'];
const SUGGESTION_META = {
  walk:{d:20,cat:'hobby'}, noscreen:{d:10,cat:'other'}, water:{d:5,cat:'food'}, stretch:{d:10,cat:'hobby'},
  tidy:{d:15,cat:'other'}, friend:{d:45,cat:'hobby'}, read:{d:20,cat:'hobby'}, planTomorrow:{d:10,cat:'other'},
  mealNoScreen:{d:20,cat:'food'}, outside:{d:10,cat:'hobby'}, breathe:{d:5,cat:'other'}, sleepgo:{d:30,cat:'sleep',fixed:true}
};

const STR = {
  he: {
    tagline: 'תגיד מה יש לך לעשות — Manage It בונה לך את הסדר יום',
    settingsTitle: 'הגדרות היום שלי',
    dayStart: 'שעת התחלה', dayEnd: 'שעת סיום', numDays: 'לכמה ימים לתכנן?', bedtime: 'יעד שעת שינה',
    taskCardTitle: 'מה יש לך לעשות?', taskLabel: 'המשימה', taskPlaceholder: 'לדוגמה: שיעורי בית במתמטיקה',
    categoryLabel: 'קטגוריה', dayLabel: 'לאיזה יום?', todayChip: 'היום', dayChip: n=>`יום ${n}`,
    durationLabel: 'משך זמן', durHoursLabel: 'שעות', durMinLabel: 'דקות',
    durLabels: {15:"15 דק'", 30:"30 דק'", 45:"45 דק'", 60:'שעה', 90:'שעה וחצי', 120:'שעתיים'},
    fixedToggle: 'יש לי שעה מסוימת שזה חייב לקרות בה', fixedTimeLabel: 'שעה מדויקת', addBtn: 'להוסיף למסלול',
    suggestTitle: 'רעיונות לתוספת ליום ✦', refreshSuggest: 'רעיונות אחרים',
    railTitle: (d,s,e) => `ציר ${d} (${s}–${e})`,
    tasksTitle: 'המשימות שלי', emptyDay: 'אין עדיין משימות ליום הזה. תוסיף למעלה ⬆',

    resetConfirm: 'למחוק את כל המשימות ולהתחיל מחדש?', now: 'עכשיו', minutesWord: "דק'",
    templatesTitle: 'תבניות יום', saveTemplateBtn: 'לשמור את היום המוצג כתבנית',
    noTemplates: 'עוד אין תבניות שמורות. תבנה יום ותשמור אותו כתבנית ⬆',
    templatePromptName: 'איך לקרוא לתבנית?', templateEmptyDay: 'אין משימות ביום המוצג לשמור',
    templateApplyConfirm: name => `להחליף את המשימות של היום הנבחר בתבנית "${name}"?`,
    templateDeleteConfirm: name => `למחוק את התבנית "${name}"?`,
    shareBtn: '🔗 שתף עם חבר', shareCopied: '✓ הועתק!',
    aboutBtn: 'ℹ️ אודות',

const RTL_LANGS = ['he','ar'];
function t(){ return STR[settings.lang]; }

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function dateKey(d){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function timeToMinutes(tm){ const [h,m]=tm.split(':').map(Number); return h*60+m; }
function minutesToTimeLabel(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(mins/60).toString().padStart(2,'0');
  const m = (mins%60).toString().padStart(2,'0');
  return `${h}:${m}`;
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      tasks = parsed.tasks || [];
      templates = parsed.templates || [];
      completions = parsed.completions || {};
      settings = Object.assign(settings, parsed.settings || {});
      seqCounter = parsed.seqCounter || tasks.length;
    }
  }catch(e){ tasks = []; }
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks, templates, completions, settings, seqCounter})); }
  catch(e){ console.error('Storage error', e); }
}

function applyLangAttrs(){
  document.documentElement.lang = settings.lang;
  document.documentElement.dir = RTL_LANGS.includes(settings.lang) ? 'rtl' : 'ltr';
  document.getElementById('langSelect').value = settings.lang;
  document.getElementById('shareBtn').textContent = t().shareBtn;
  document.getElementById('aboutBtn').textContent = t().aboutBtn;
  document.getElementById('summaryBtn').textContent = t().summaryBtn;
  document.getElementById('durHoursLabelText').textContent = t().durHoursLabel;
  document.getElementById('durMinLabelText').textContent = t().durMinLabel;
  updateNotifyBtn();
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(typeof t()[key] === 'string') el.textContent = t()[key];
  });
  document.getElementById('titleInput').placeholder = t().taskPlaceholder;
}

// ---- Scheduling ----
function scheduleAll(){ for(let d=0; d<settings.numDays; d++){ scheduleDay(d); } }
function scheduleDay(dayIndex){
  const dayTasks = tasks.filter(x=>x.day===dayIndex);
  const fixed = dayTasks.filter(x=>x.fixedTime!=null).sort((a,b)=>a.fixedTime-b.fixedTime);
  const flexible = dayTasks.filter(x=>x.fixedTime==null).sort((a,b)=>a.seq-b.seq);
  let busy = [];
  fixed.forEach(x=>{
    let start = x.fixedTime;
    for(const b of busy){ if(start < b.end && start + x.duration > b.start){ start = b.end; } }
    const end = start + x.duration;
    x.start = start;
    x.overflow = end > settings.dayEnd || start < settings.dayStart;
    busy.push({start, end}); busy.sort((a,b)=>a.start-b.start);
  });
  flexible.forEach(x=>{
    let placed = false; let cursor = settings.dayStart;
    const sortedBusy = [...busy].sort((a,b)=>a.start-b.start);
    for(const b of sortedBusy){
      if(b.start - cursor >= x.duration){ x.start = cursor; placed = true; break; }
      cursor = Math.max(cursor, b.end);
    }
    if(!placed){ x.start = cursor; x.overflow = !(cursor + x.duration <= settings.dayEnd); placed = true; }
    else{ x.overflow = false; }
    busy.push({start:x.start, end:x.start+x.duration}); busy.sort((a,b)=>a.start-b.start);
  });
}

  scheduleAll();
  renderDurationChips();
  renderCatChipsInForm();

  renderStreak();

}

function computeStreak(){
  const dateSet = new Set(Object.values(completions).map(c=>c.date));
  let count = 0;
  let cursor = new Date();
  if(!dateSet.has(dateKey(cursor))){ cursor.setDate(cursor.getDate()-1); }
  while(dateSet.has(dateKey(cursor))){ count++; cursor.setDate(cursor.getDate()-1); }
  return count;
}
function computeWeeklyStats(){
  const dateSet = new Set();
  for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); dateSet.add(dateKey(d)); }
  const counts = {}; CAT_IDS.forEach(id=>counts[id]=0);
  Object.values(completions).forEach(c=>{
    if(dateSet.has(c.date) && counts.hasOwnProperty(c.category)) counts[c.category]++;
  });
  return counts;
}
function renderStreak(){
  const n = computeStreak();
  document.getElementById('streakBadge').textContent = t().streakLabel(n);
}
function renderWeeklyStats(){
  const box = document.getElementById('statsContent');
  const counts = computeWeeklyStats();
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  box.innerHTML = '';
  if(total === 0){ box.innerHTML = `<div class="empty" style="padding:6px 0;">${t().statsEmpty}</div>`; return; }
  const max = Math.max(...Object.values(counts), 1);
  CAT_IDS.forEach(id=>{
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `<div class="stat-row-top"><span>${t().categories[id]}</span><span class="cnt">${counts[id]}</span></div>
      <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${(counts[id]/max*100)}%; background:${CAT_COLORS[id]}"></div></div>`;
    box.appendChild(row);
  });
}
function renderSummaryContent(){
  const box = document.getElementById('summaryContent');
  const todayTasks = tasks.filter(x=>x.day===0);
  if(todayTasks.length === 0){ box.innerHTML = `<p>${t().summaryNone}</p>`; return; }
  const done = todayTasks.filter(x=>x.done).length;
  const left = todayTasks.length - done;
  let html = `<div class="summary-row"><strong>${t().summaryDone(done)}</strong><strong>${t().summaryLeft(left)}</strong></div>`;
  [...todayTasks].sort((a,b)=>a.start-b.start).forEach(x=>{
    html += `<div class="summary-row"><span>${x.done?'✅':'⬜'} ${escapeHtml(x.title)}</span><span style="color:var(--muted)">${minutesToTimeLabel(x.start)}</span></div>`;
  });
  box.innerHTML = html;
}

function renderTemplates(){
  document.getElementById('saveTemplateBtn').textContent = t().saveTemplateBtn;
  const box = document.getElementById('templateChips');
  const emptyBox = document.getElementById('templateEmpty');
  box.innerHTML = '';
  if(templates.length === 0){
    emptyBox.style.display = 'block';
    emptyBox.textContent = t().noTemplates;
    return;
  }
  emptyBox.style.display = 'none';
  templates.forEach(tpl=>{
    const chip = document.createElement('div');
    chip.className = 'suggest-chip';
    chip.innerHTML = `<span>📋 ${escapeHtml(tpl.name)}</span> <span data-del-tpl="${tpl.id}" style="opacity:.6;margin-inline-start:4px;">✕</span>`;
    chip.addEventListener('click', async (e)=>{
      if(e.target.hasAttribute('data-del-tpl')){
        if(confirm(t().templateDeleteConfirm(tpl.name))){
          templates = templates.filter(x=>x.id!==tpl.id);
          await saveState(); renderTemplates();
        }
        return;
      }
      if(!confirm(t().templateApplyConfirm(tpl.name))) return;
      tasks = tasks.filter(x=>x.day!==selectedDay);
      tpl.items.forEach(item=>{
        tasks.push({
          id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          seq: seqCounter++,
          title: item.title, duration: item.duration, fixedTime: item.fixedTime,
          day: selectedDay, overflow:false, done:false, category: item.category
        });
      });
      await saveState();
      activeTab = selectedDay;
      render();
    });
    box.appendChild(chip);
  });
}

async function saveCurrentDayAsTemplate(){
  const dayTasks = tasks.filter(x=>x.day===activeTab);
  if(dayTasks.length === 0){ alert(t().templateEmptyDay); return; }
  const name = prompt(t().templatePromptName);
  if(!name || !name.trim()) return;
  templates.push({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name: name.trim(),
    items: dayTasks.map(x=>({title:x.title, duration:x.duration, fixedTime:x.fixedTime, category:x.category}))
  });
  await saveState();
  renderTemplates();
}

function renderDayChipsInForm(){

  box.innerHTML = '';
  for(let d=0; d<settings.numDays; d++){
    const chip = document.createElement('div');
    chip.className = 'chip' + (d===selectedDay ? ' selected' : '');
    chip.textContent = settings.numDays===1 ? t().todayChip : t().dayChip(d+1);
    chip.addEventListener('click', ()=>{ selectedDay = d; renderDayChipsInForm(); });
    box.appendChild(chip);
  }
}

function renderDayTabs(){
  const box = document.getElementById('dayTabs');
  box.innerHTML = '';
  if(activeTab >= settings.numDays) activeTab = settings.numDays-1;
  for(let d=0; d<settings.numDays; d++){
    const tab = document.createElement('div');
    tab.className = 'day-tab' + (d===activeTab ? ' active' : '');
    tab.textContent = settings.numDays===1 ? t().todayChip : t().dayChip(d+1);
    tab.addEventListener('click', ()=>{ activeTab = d; render(); });
    box.appendChild(tab);
  }
  const dayName = settings.numDays===1 ? t().todayChip : t().dayChip(activeTab+1);
  document.getElementById('railTitle').textContent =
    t().railTitle(dayName, minutesToTimeLabel(settings.dayStart), minutesToTimeLabel(settings.dayEnd));
}

function renderRail(){
  const grid = document.getElementById('railGrid');
  grid.innerHTML = '';
  const totalRows = Math.max(1, (settings.dayEnd - settings.dayStart)/15);
  grid.style.gridTemplateRows = `repeat(${totalRows}, var(--row-h))`;

  const startHour = Math.floor(settings.dayStart/60);
  const endHour = Math.ceil(settings.dayEnd/60);
  for(let h=startHour; h<endHour; h++){
    const label = document.createElement('div');
    label.className = 'hour-label';
    label.textContent = h.toString().padStart(2,'0') + ':00';
    const rowStart = ((h*60) - settings.dayStart)/15 + 1;
    if(rowStart >= 1){ label.style.gridRow = `${rowStart} / span 4`; grid.appendChild(label); }
  }

  const dayTasks = tasks.filter(x=>x.day===activeTab);
  dayTasks.forEach(x=>{
    const block = document.createElement('div');
    block.className = 'task-block' + (x.done?' done':'') + (x.overflow?' overflow':'');
    const startRow = Math.max(1, Math.round((x.start - settings.dayStart)/15) + 1);
    const span = Math.max(1, Math.round(x.duration/15));
    block.style.gridRow = `${startRow} / span ${span}`;
    block.style.background = CAT_COLORS[x.category] || CAT_COLORS.other;
    block.textContent = x.title;
    grid.appendChild(block);
  });

  const existingLine = document.querySelector('.now-line');
  if(existingLine) existingLine.remove();
  updateNowLine();
}

function updateNowLine(){
  const existingLine = document.querySelector('.now-line');
  if(existingLine) existingLine.remove();
  const nowMins = new Date().getHours()*60 + new Date().getMinutes();
  if(activeTab===0 && nowMins >= settings.dayStart && nowMins <= settings.dayEnd){
    const nowLine = document.createElement('div');
    nowLine.className = 'now-line';
    nowLine.setAttribute('data-label', t().now);
    nowLine.style.top = (((nowMins - settings.dayStart)/15) * 13) + 'px';
    document.querySelector('.rail-outer').appendChild(nowLine);
  }
}

        <div class="meta ${x.overflow?'overflow':''}">${minutesToTimeLabel(x.start)} · ${x.duration} ${t().minutesWord} · ${t().categories[x.category]}${x.overflow?t().overflowNote:''}</div>
      </div>
      <button data-del="${x.id}">✕</button>
    `;
    list.appendChild(item);
  });
  list.querySelectorAll('.check').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const task = tasks.find(y=>y.id===el.getAttribute('data-id'));
      if(task){
        task.done = !task.done;
        if(task.day === 0){
          if(task.done){ completions[task.id] = { date: todayStr(), category: task.category }; }
          else{ delete completions[task.id]; }
        }
        await saveState(); render();
      }
    });
  });
  list.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      tasks = tasks.filter(y=>y.id!==el.getAttribute('data-del'));
      await saveState(); render();
    });
  });
}

function renderSuggestions(){
  const box = document.getElementById('suggestChips');
  box.innerHTML = '';
  const shuffled = [...SUGGESTION_IDS].sort(()=>Math.random()-0.5).slice(0,3);
  shuffled.forEach(id=>{
    const meta = SUGGESTION_META[id];
    const chip = document.createElement('div');
    chip.className = 'suggest-chip';
    chip.innerHTML = `<span class="plus">+</span> ${escapeHtml(t().suggestions[id])}`;
    chip.addEventListener('click', async ()=>{
      tasks.push({
        id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        seq: seqCounter++,
        title: t().suggestions[id],
        duration: meta.d>0 ? meta.d : 15,
        fixedTime: meta.fixed ? settings.bedtime : null,
        day: activeTab, overflow:false, done:false, category: meta.cat
      });
      await saveState(); render();
    });
    box.appendChild(chip);
  });
}

function escapeHtml(str){ const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }

// ---- Events ----
document.getElementById('fixedTimeToggle').addEventListener('change', e=>{
  document.getElementById('fixedTimeField').style.display = e.target.checked ? 'block' : 'none';
});

function syncDurationFromFields(){
  const h = Math.max(0, Number(document.getElementById('durationHoursInput').value)||0);
  const m = Math.max(0, Number(document.getElementById('durationMinInput').value)||0);
  selectedDuration = h*60+m;
  document.querySelectorAll('#durationChips .chip').forEach(c=>c.classList.remove('selected'));
}
document.getElementById('durationHoursInput').addEventListener('input', syncDurationFromFields);
document.getElementById('durationMinInput').addEventListener('input', syncDurationFromFields);

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const titleInput = document.getElementById('titleInput');
  const title = titleInput.value.trim();
  if(!title){ titleInput.focus(); return; }
  const h = Math.max(0, Number(document.getElementById('durationHoursInput').value)||0);
  const m = Math.max(0, Number(document.getElementById('durationMinInput').value)||0);
  const duration = (h*60+m) > 0 ? (h*60+m) : 30;
  const useFixed = document.getElementById('fixedTimeToggle').checked;
  const fixedTimeInput = document.getElementById('fixedTimeInput');
  let fixedTime = null;
  if(useFixed && fixedTimeInput.value){ fixedTime = timeToMinutes(fixedTimeInput.value); }

  tasks.push({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    seq: seqCounter++,
    title, duration, fixedTime,
    day: selectedDay, overflow:false, done:false, category: selectedCategory
  });
  await saveState();
  titleInput.value = '';
  document.getElementById('fixedTimeToggle').checked = false;
  document.getElementById('fixedTimeField').style.display = 'none';
  fixedTimeInput.value = '';
  activeTab = selectedDay;
  render();
});

document.getElementById('refreshSuggestBtn').addEventListener('click', renderSuggestions);
document.getElementById('saveTemplateBtn').addEventListener('click', saveCurrentDayAsTemplate);

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const url = window.location.href.split('#')[0];
  const btn = document.getElementById('shareBtn');
  const original = t().shareBtn;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url);
    } else {
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.textContent = t().shareCopied;
    setTimeout(()=>{ btn.textContent = original; }, 1500);
  }catch(e){
    btn.textContent = url;
  }
});

document.getElementById('aboutBtn').addEventListener('click', ()=>{
  document.getElementById('aboutOverlay').style.display = 'flex';
});
document.getElementById('aboutClose').addEventListener('click', ()=>{
  document.getElementById('aboutOverlay').style.display = 'none';
});
document.getElementById('aboutOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'aboutOverlay') document.getElementById('aboutOverlay').style.display = 'none';
});

document.getElementById('themeToggle').addEventListener('click', async ()=>{
  settings.theme = settings.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', settings.theme);
  document.getElementById('themeToggle').textContent = settings.theme === 'dark' ? '🌙' : '☀️';
  await saveState();
});

document.getElementById('summaryBtn').addEventListener('click', ()=>{
  renderSummaryContent();
  document.getElementById('summaryOverlay').style.display = 'flex';
});
document.getElementById('summaryClose').addEventListener('click', ()=>{
  document.getElementById('summaryOverlay').style.display = 'none';
});
document.getElementById('summaryOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'summaryOverlay') document.getElementById('summaryOverlay').style.display = 'none';
});

// ---- Notifications (foreground-only; see about note) ----
function updateNotifyBtn(){
  const btn = document.getElementById('notifyBtn');
  if(typeof Notification === 'undefined'){ btn.style.display = 'none'; return; }
  if(Notification.permission === 'denied'){ btn.textContent = t().notifyDenied; return; }
  btn.textContent = (settings.notifyEnabled ? t().notifyBtnOn : t().notifyBtnOff) + ' ' + t().notifyLimitNote;
}
document.getElementById('notifyBtn').addEventListener('click', async ()=>{
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'denied'){ return; }
  if(Notification.permission !== 'granted'){
    const perm = await Notification.requestPermission();
    settings.notifyEnabled = perm === 'granted';
  } else {
    settings.notifyEnabled = !settings.notifyEnabled;
  }
  await saveState();
  updateNotifyBtn();
});
function checkReminders(){
  if(!settings.notifyEnabled || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const nowMins = new Date().getHours()*60 + new Date().getMinutes();
  tasks.filter(x=>x.day===0 && x.fixedTime!=null && !x.done && !x.notified).forEach(x=>{
    const diff = x.fixedTime - nowMins;
    if(diff >= 0 && diff <= 5){
      try{ new Notification('Manage It', { body: x.title, icon: 'icon-192.png' }); }catch(e){}
      x.notified = true;
      saveState();
    }
  });
}

// ---- Onboarding ----
let onboardIndex = 0;
function renderOnboardStep(){
  const steps = t().onboardSteps;
  const s = steps[onboardIndex];
  document.getElementById('onboardEmoji').textContent = s.emoji;
  document.getElementById('onboardTitle').textContent = s.title;
  document.getElementById('onboardBody').textContent = s.body;
  document.getElementById('onboardSkip').textContent = t().onboardSkip;
  document.getElementById('onboardNext').textContent = onboardIndex === steps.length-1 ? t().onboardStart : t().onboardNext;
  const dots = document.getElementById('onboardDots');
  dots.innerHTML = '';
  steps.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'onboard-dot' + (i===onboardIndex ? ' active' : '');
    dots.appendChild(d);
  });
}
function closeOnboarding(){
  document.getElementById('onboardOverlay').style.display = 'none';
  localStorage.setItem('manageit-onboarded', '1');
}
document.getElementById('onboardNext').addEventListener('click', ()=>{
  const steps = t().onboardSteps;
  if(onboardIndex === steps.length-1){ closeOnboarding(); }
  else{ onboardIndex++; renderOnboardStep(); }
});
document.getElementById('onboardSkip').addEventListener('click', closeOnboarding);

document.getElementById('dayStartInput').addEventListener('change', async e=>{ settings.dayStart = timeToMinutes(e.target.value); await saveState(); render(); });
document.getElementById('dayEndInput').addEventListener('change', async e=>{ settings.dayEnd = timeToMinutes(e.target.value); await saveState(); render(); });
document.getElementById('bedtimeInput').addEventListener('change', async e=>{ settings.bedtime = timeToMinutes(e.target.value); await saveState(); });
document.getElementById('numDaysInput').addEventListener('change', async e=>{
  let n = Math.max(1, Math.min(7, Number(e.target.value)||1));
  settings.numDays = n; e.target.value = n;
  if(selectedDay >= n) selectedDay = n-1;
  await saveState(); render();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(confirm(t().resetConfirm)){
    tasks = []; seqCounter = 0; activeTab = 0; selectedDay = 0;
    await saveState(); render();
  }
});

document.getElementById('langSelect').addEventListener('change', async (e)=>{
  settings.lang = e.target.value;
  await saveState();
  render();
  renderSuggestions();
});

// ---- Init ----
(async ()=>{
  await loadState();
  document.documentElement.setAttribute('data-theme', settings.theme || 'dark');
  document.getElementById('themeToggle').textContent = settings.theme === 'light' ? '☀️' : '🌙';
  document.getElementById('dayStartInput').value = minutesToTimeLabel(settings.dayStart);
  document.getElementById('dayEndInput').value = minutesToTimeLabel(settings.dayEnd);
  document.getElementById('bedtimeInput').value = minutesToTimeLabel(settings.bedtime);
  document.getElementById('numDaysInput').value = settings.numDays;
  document.getElementById('durationHoursInput').value = Math.floor(selectedDuration/60);
  document.getElementById('durationMinInput').value = selectedDuration%60;
  renderSuggestions();
  render();
  updateNotifyBtn();
  setInterval(updateNowLine, 60000);
  setInterval(checkReminders, 30000);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }

  const overlay = document.getElementById('loadingOverlay');
  overlay.style.opacity = '0';
  setTimeout(()=>{ overlay.style.display = 'none'; }, 300);

  if(!localStorage.getItem('manageit-onboarded')){
    onboardIndex = 0;
    renderOnboardStep();
    document.getElementById('onboardOverlay').style.display = 'flex';
  }
})();
</script>
